name: Build HouseNail Android V10 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -path "*/bin/sdkmanager" -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/android-cmdline.zip
            unzip -q /tmp/android-cmdline.zip -d /tmp/android-cmdline
            mv /tmp/android-cmdline/cmdline-tools/* "$HOME/android-sdk/cmdline-tools/latest/"
            echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
            SDKMANAGER="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HouseNail-Android-V10-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
